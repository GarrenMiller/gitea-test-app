name: build-net48

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build Release
        shell: cmd
        run: msbuild "%GITHUB_WORKSPACE%\HelloNet48\HelloNet48.csproj" /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Verify output
        shell: cmd
        run: dir "%GITHUB_WORKSPACE%\HelloNet48\bin\Release"

      - name: Create release
        shell: cmd
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\create-release.ps1"
