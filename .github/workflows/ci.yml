name: build-net48

on:
  push:

jobs:
  build:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Toolchain info
        shell: cmd
        run: |
          where msbuild
          msbuild -version

      - name: Build Release
        shell: cmd
        run: msbuild HelloNet48\HelloNet48.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Verify output
        shell: cmd
        run: dir HelloNet48\bin\Release
