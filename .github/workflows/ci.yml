name: build-net48

on:
  push:

jobs:
  build:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Toolchain info
        shell: cmd
        run: |
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%
          cd
          dir /a "%GITHUB_WORKSPACE%"
          git -C "%GITHUB_WORKSPACE%" ls-files
          where msbuild
          msbuild -version

      - name: Build Release
        shell: cmd
        run: msbuild "%GITHUB_WORKSPACE%\HelloNet48\HelloNet48.csproj" /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Verify output
        shell: cmd
        run: dir "%GITHUB_WORKSPACE%\HelloNet48\bin\Release"
